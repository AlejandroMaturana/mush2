name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NODE_VERSION: '22'

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Create config.h
        run: |
          cd firmware
          # PR-C/CI: overrides mínimos + template completo (config.example.h).
          # El heredoc anterior omitía defines que el código fuente requiere
          # (BUTTON_*/BLE_*/I2C_*/STACK_*/health_monitor…) y rompía el build.
          echo '#ifndef CONFIG_H
          #define CONFIG_H
          #define WIFI_SSID_1 ""
          #define WIFI_PASSWORD_1 ""
          #define WIFI_SSID_2 ""
          #define WIFI_PASSWORD_2 ""
          #define BACKEND_HOST "localhost"
          #define BACKEND_PORT 3797
          #define DEVICE_ID "ci_build"
          #define HW_REVISION "1.0"
          #define OTA_PASSWORD "CHANGE_ME_OTA_PASSWORD"
          #define OTA_CA_ROOT ""
          #include "config.example.h"
          #endif' > src/config.h

      - name: Build firmware
        run: cd firmware && pio run

      - name: Firmware unit tests (native)
        run: cd firmware && pio test -c platformio.test.ini -e native

      - name: Firmware coverage gate (I105, >=60%)
        run: cd firmware && python test/scripts/coverage_gate.py

      - name: Compile hardware sketches (I110)
        run: |
          cd firmware
          for sk in test/S3_test-actuator-chain test/S3_test-button test/S3_test-http-poller test/S3_test-watchdog; do
            echo "=== $sk ==="
            pio run -d "$sk"
          done

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mush2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd backend && pnpm install --frozen-lockfile

      - name: Run tests
        run: cd backend && pnpm run test:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mush2_test
          NODE_ENV: test
          LOG_LEVEL: silent

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Version manifest consistency (I078/INF-019)
        run: node scripts/check-version-manifest.cjs

      - name: Test (I080/I109)
        run: cd frontend && pnpm run test

      - name: Build
        run: cd frontend && pnpm run build

  security:
    name: Security gates (audit + gitleaks + osv-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: pnpm audit (umbral critical, política de severidad I076)
        run: |
          cd backend  && pnpm audit --audit-level=critical
          cd ../frontend && pnpm audit --audit-level=critical

      - name: gitleaks — detección de secretos en el árbol (I076/I84)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: osv-scanner — reporte de vulnerabilidades (I076)
        uses: google/osv-scanner/actions/scanner@v1
        with:
          scan-args: |-
            --format
            sarif
            --output
            results.sarif
            --recursive
            .
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  deploy:
    name: Deploy (Render) & health check
    # I067/INF-008: deploy automático en push a main, verificado por /health.
    # Inactivo hasta que exista el secreto RENDER_DEPLOY_HOOK (hook único de
    # Render) — sin URL falsa hardcodeada (DECISION-011 PENDING).
    # Temporarily disabled — secrets context in job-level if may cause workflow parse error.
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK != ''
    if: false
    runs-on: ubuntu-latest
    needs: [firmware, backend, frontend, security]
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" >/dev/null

      - name: Verify /health after deploy
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL || 'https://mush2.onrender.com/health' }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: $HEALTH_URL -> 200 (tras $(( (i-1) * 10 ))s)"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: $HEALTH_URL no responde 200 tras 300s (último estado: $code)"
          exit 1
