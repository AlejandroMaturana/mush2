name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NODE_VERSION: '22'

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Create config.h
        run: |
          cd firmware
          echo '#ifndef CONFIG_H
          #define CONFIG_H
          #define WIFI_SSID_1 ""
          #define WIFI_PASSWORD_1 ""
          #define WIFI_SSID_2 ""
          #define WIFI_PASSWORD_2 ""
          #define BACKEND_HOST "localhost"
          #define BACKEND_PORT 3797
          #define POLL_INTERVAL 3000
          #define DEVICE_ID "ci_build"
          #define SENSOR_INTERVAL 10000
          #define SSR_ACTIVE_LOW 1
          #include "channel_mapping.h"
          #define SSR_CH1_PIN CHANNEL_1_PIN
          #define SSR_CH2_PIN CHANNEL_2_PIN
          #define SSR_CH3_PIN CHANNEL_3_PIN
          #define SSR_CH4_PIN CHANNEL_4_PIN
          #define DEFAULT_TEMP_MIN 20.0
          #define DEFAULT_TEMP_MAX 24.0
          #define DEFAULT_HUM_MIN 85.0
          #define DEFAULT_HUM_MAX 95.0
          #define DEFAULT_CO2_MAX 1200
          #define HW_REVISION "1.0"
          #endif' > src/config.h

      - name: Build firmware
        run: cd firmware && pio run

      - name: Firmware unit tests (native)
        run: cd firmware && pio test -c platformio.test.ini -e native

      - name: Compile hardware sketches (I110)
        run: |
          cd firmware
          for sk in test/S3_test-actuator-chain test/S3_test-button test/S3_test-http-poller test/S3_test-watchdog; do
            echo "=== $sk ==="
            pio run -d "$sk"
          done

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mush2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd backend && pnpm install --frozen-lockfile

      - name: Run tests
        run: cd backend && pnpm run test:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mush2_test
          NODE_ENV: test
          LOG_LEVEL: silent

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Test (I080/I109)
        run: cd frontend && pnpm run test

      - name: Build
        run: cd frontend && pnpm run build

  security:
    name: Security gates (audit + gitleaks + osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: pnpm audit (umbral critical, política de severidad I076)
        run: |
          cd backend  && pnpm audit --audit-level=critical
          cd ../frontend && pnpm audit --audit-level=critical

      - name: gitleaks — detección de secretos en el árbol (I076/I84)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: osv-scanner — reporte de vulnerabilidades (I076)
        uses: google/osv-scanner/actions/scanner@v1
        with:
          scan-args: |-
            --recursive
            .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
