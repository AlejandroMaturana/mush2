services:
  - type: web
    name: mush2
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mush2-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DB_USER
        fromDatabase:
          name: mush2-db
          property: user
      - key: DB_HOST
        fromDatabase:
          name: mush2-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: mush2-db
          property: database
      - key: DB_PASSWORD
        fromDatabase:
          name: mush2-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: mush2-db
          property: port
      # ── MQTT Broker ────────────────────────────────────────────
      # PENDING DEPENDENCY: No MQTT broker deployed yet for Render.
      # When a broker is added (e.g. Mosquitto on Railway/Fly.io),
      # set MQTT_BROKER_URL and MQTT_BROKER_PASS here.
      # Without these, the MQTT bridge will fail gracefully on startup
      # (non-blocking — backend still serves HTTP/API).
      # - key: MQTT_BROKER_URL
      #   value: mqtt://YOUR-BROKER-HOST:1883
      # - key: MQTT_BROKER_PASS
      #   value: YOUR_BROKER_PASSWORD

databases:
  - name: mush2-db
    plan: free
    databaseName: mush2
    ipAllowList: []
