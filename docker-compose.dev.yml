# ── Development Environment (ADR-029) ──────────────────────────────
# This file creates an isolated development stack.
# It MUST NOT share containers, volumes, or networks with docker-compose.yml.
#
# PostgreSQL uses defaults matching .env.development.
# Override via shell: DB_PASSWORD=xxx docker compose -f docker-compose.dev.yml up -d
#
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  # ── MQTT Broker (Development) ────────────────────────────────────
  dev-mosquitto:
    image: eclipse-mosquitto:2
    container_name: mush2-dev-mosquitto
    restart: unless-stopped
    ports:
      - "1884:1883"
    volumes:
      - ./docker/mosquitto/dev:/mosquitto/config:ro
      - ./docker/mosquitto/certs:/mosquitto/certs:ro
      - mush2-dev-mosquitto-data:/mosquitto/data
      - mush2-dev-mosquitto-log:/mosquitto/log
    networks:
      - mush2-dev-internal

  # ── PostgreSQL (Development) ─────────────────────────────────────
  dev-postgres:
    image: postgres:16-alpine
    container_name: mush2-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mush2_dev}
      POSTGRES_USER: ${DB_USER:-mush2_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mush2_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - mush2-dev-pgdata:/var/lib/postgresql/data
    networks:
      - mush2-dev-internal

networks:
  mush2-dev-internal:
    driver: bridge

volumes:
  mush2-dev-pgdata:
  mush2-dev-mosquitto-data:
  mush2-dev-mosquitto-log:
