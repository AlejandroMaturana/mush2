# ── Mosquitto 2.x — Production (ADR-029) ─────────────────────────
# Isolated configuration for production stack.
# MUST NOT share files, volumes, or configs with development.
#
# Deployment plan: docs/operations/broker-deployment.md (PR-G, ISSUE-065).
#
# Usage: docker compose up -d

# ── Persistence ──────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# ── Default listener (MQTT, internal only) ──────────────────────
# Port 1883: accesible solo desde la red Docker (no expuesto al host).
# Listener interno para ops/legacy. El backend bridge NO usa este puerto en
# producción: exige TLS (mqtts://) desde ISSUE-015/PR-L (fail-fast en validate).
listener 1883
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl.conf

# ── TLS listener (MQTTS, externo) ──────────────────────────────
# Port 8883: expuesto al host para firmware ESP32.
# Backend bridge (ISSUE-015/PR-L) y firmware ESP32 se conectan SOLO por este
# listener TLS en producción (MQTT_BROKER_URL=mqtts://...:8883).
# Certs reales montados en /mosquitto/certs (volumen privado) — nunca en el repo
# (docs/operations/broker-deployment.md §5). Activo desde ISSUE-074/PR-A (C2).
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl.conf
