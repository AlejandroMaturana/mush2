# ── Mosquitto 2.x — Production (ADR-029) ─────────────────────────
# Isolated configuration for production stack.
# MUST NOT share files, volumes, or configs with development.
#
# Usage: docker compose up -d

# ── Persistence ──────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# ── Default listener (MQTT, internal only) ──────────────────────
# Port 1883: accesible solo desde la red Docker (no expuesto al host).
# Usado por el backend bridge para conectarse sin TLS.
listener 1883
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl.conf

# ── TLS listener (MQTTS, externo) ──────────────────────────────
# Port 8883: expuesto al host para firmware ESP32.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
# allow_anonymous false
# password_file /mosquitto/config/password_file
# acl_file /mosquitto/config/acl.conf
