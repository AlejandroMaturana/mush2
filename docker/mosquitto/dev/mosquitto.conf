# ── Mosquitto 2.x — Development (ADR-029) ────────────────────────
# Isolated configuration for development stack.
# MUST NOT share files, volumes, or configs with production.
#
# Usage: docker compose -f docker-compose.dev.yml up -d

# ── Persistence ──────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# ── Listener (MQTT, internal only) ──────────────────────────────
# Port 1883 internal (mapped to 1884 on host by docker-compose).
# No TLS — development only.
listener 1883
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl.conf
