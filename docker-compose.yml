# ── Production-like Local Stack (ADR-029) ──────────────────────────
# Creates a production-like stack locally.
# PostgreSQL is NOT exposed to the host — access only via Docker network.
#
# For actual production deployment (Render), use the dashboard or
# render.yaml. DATABASE_URL is injected by the PostgreSQL addon.
#
# Usage:
#   docker compose --env-file .env.production up -d

services:
  # ── MQTT Broker ────────────────────────────────────────────────
  # Port 8883 (MQTTS) expuesto al host para firmware.
  # Port 1883 (MQTT) solo accesible dentro de la red Docker.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mush2-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./docker/mosquitto/prod:/mosquitto/config:ro
      - ./docker/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - mush2-internal

  # ── PostgreSQL ─────────────────────────────────────────────────
  # NO ports exposed to host — ADR-029 compliance.
  # Access only via Docker network (postgres:5432).
  postgres:
    image: postgres:16-alpine
    container_name: mush2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mush2}
      POSTGRES_USER: ${DB_USER:-mush2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production or shell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mush2-internal

  # ── Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mush2-backend
    restart: unless-stopped
    ports:
      - "3797:3797"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mush2:${DB_PASSWORD}@postgres:5432/mush2
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_BROKER_USER: backend_bridge
      MQTT_BROKER_PASS: ${MQTT_BROKER_PASS:?Set MQTT_BROKER_PASS in .env.production or shell}
    depends_on:
      - mosquitto
      - postgres
    networks:
      - mush2-internal

networks:
  mush2-internal:
    driver: bridge

volumes:
  pgdata:
  mosquitto-data:
  mosquitto-log:
