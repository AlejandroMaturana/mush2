; Config de test host-only para firmware. NO usada por `pio run` (build de dispositivo).
; Uso: pio test -c platformio.test.ini -e native
;
; La suite nativa compila los modulos src/ seleccionados via `#include "../src/*.cpp"`
; desde los test_*.cpp (patron de un solo main por binario). Los stubs de Arduino/ESP32
; viven en test/stubs (nunca se usan en el build de dispositivo).
;
; Gate de cobertura I105: --coverage + script test/scripts/coverage_gate.py (ver ci.yml).
[platformio]
src_dir = test

[env:native]
platform = native
test_framework = unity
test_filter = test_channel_mapping|test_mqtt_credentials|test_hysteresis|test_ota_decisor|test_actuator_nvs|test_ota_nvs|test_telemetry_buffer|test_ota_executor|test_state_machine|test_ota_postboot
build_flags =
    -Isrc
    -Itest/stubs
    -std=gnu++17
    -Wall
    -Werror=return-type
    ; config.h es gitignored (credenciales reales). Se excluye via el guard CONFIG_H
    ; y se definen las constantes que hysteresis_controller.cpp lee de la config.
    -DCONFIG_H
    -DTEMP_CRITICAL=32.0
    -DTEMP_RECOVERY=28.0
    -DPOST_VENT_DELAY=10000UL
    -DPOST_VENT_DURATION=30000UL
    -DFIRMWARE_VERSION="\"0.23.4\""
    --coverage
    -lgcov
