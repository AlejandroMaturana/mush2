; Proyecto autónomo de integración (CH-T13): valida cadena de actuadores en hardware.
; Uso: pio run -d test/S3_test-actuator-chain -t upload   (monitor: pio device monitor)
[platformio]
src_dir = .
src_filter = +<*.ino> +<*.cpp> +<*.h>

[env:esp32-s3-test-actuator-chain]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.flash_size = 8MB
build_flags =
    -Wall
    -I../../src
    -IC:/Users/manug/.platformio/packages/framework-arduinoespressif32/libraries/Preferences/src
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION="\"TEST-ACTUATOR-CHAIN\""
